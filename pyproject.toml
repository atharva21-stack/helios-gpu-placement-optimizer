[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-gpu-placement-optimizer"
version = "0.1.0"
description = "Topology-aware GPU fleet placement and simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
solver = ["ortools>=9.11"]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/optimizer/helios_optimizer",
  "packages/simulator/helios_simulator",
  "apps/api/helios_api",
]

[tool.pytest.ini_options]
pythonpath = [".", "packages/optimizer", "packages/simulator", "apps/api"]
testpaths = ["packages/optimizer/tests", "packages/simulator/tests", "apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
