[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-optimizer"
version = "0.1.0"
description = "Topology-aware GPU placement optimizer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cpsat = ["ortools>=9.10"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
